[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/policy",
    "crates/http-executor",
    "crates/agent-core",
    "crates/runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"
authors = ["Community Monitor Agent contributors"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
http = "1"
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
